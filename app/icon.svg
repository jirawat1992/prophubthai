<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />

  <g filter="url(#glow)">
    <!-- Wick Line (ไส้เทียน) -->
    <line x1="24" y1="12" x2="24" y2="52" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
    <!-- P Head / Candle Body -->
    <rect x="20" y="18" width="8" height="28" rx="4" fill="url(#primaryGrad)" />
    <path d="M26 18H38C44.6274 18 50 23.3726 50 30C50 36.6274 44.6274 42 38 42H26" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Connection Hub Dot -->
    <circle cx="38" cy="30" r="3" fill="#ffffff" />
  </g>
</svg>
